[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz_lib"
version = "0.4.0"
description = "Two aesthetic 2026 World Cup player-stat visualizations for pandas."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "mrozoen" },
]
keywords = ["visualization", "matplotlib", "pandas", "world-cup", "football", "soccer"]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "flagpy",
]

[project.urls]
Homepage = "https://github.com/mrozoen/viz_lib"

[tool.setuptools.packages.find]
where = ["src"]
