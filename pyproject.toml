[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz_lib"
version = "0.1.0"
description = "A tiny matplotlib-based visualization library for pandas DataFrames."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "mrozoen" },
]
keywords = ["visualization", "matplotlib", "pandas", "eda", "plotting"]
dependencies = [
    "matplotlib",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/mrozoen/viz_lib"

[tool.setuptools.packages.find]
where = ["src"]
