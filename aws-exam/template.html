<title>__PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root {
    --paper: #eef1f4;
    --surface: #ffffff;
    --surface-2: #f6f8fa;
    --line: #dce2e8;
    --line-strong: #c3ccd6;
    --ink: #182430;
    --ink-2: #445260;
    --ink-3: #6b7a88;
    --accent: #b85c0c;
    --accent-soft: #fbeee0;
    --on-accent: #ffffff;
    --ok: #1c6b4f;
    --ok-soft: #e4f1ea;
    --bad: #a63a2b;
    --bad-soft: #f8e8e5;
    --d1: #b85c0c;
    --d2: #2a6f7f;
    --d3: #47539b;
    --d4: #7a4e6e;
    --shadow: 0 1px 2px rgba(24, 36, 48, .06), 0 8px 24px -16px rgba(24, 36, 48, .28);

    --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  :root:not([data-theme="light"]) {
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #10161c;
      --surface: #18202a;
      --surface-2: #1f2833;
      --line: #2b3742;
      --line-strong: #3c4a57;
      --ink: #e6edf3;
      --ink-2: #a9b7c4;
      --ink-3: #7d8c9a;
      --accent: #e08b3e;
      --accent-soft: #3a2a17;
      --on-accent: #10161c;
      --ok: #4fbf8e;
      --ok-soft: #16302a;
      --bad: #e88070;
      --bad-soft: #33201c;
      --d1: #e08b3e;
      --d2: #5aa9b8;
      --d3: #8790d6;
      --d4: #c08ab0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #10161c;
    --surface: #18202a;
    --surface-2: #1f2833;
    --line: #2b3742;
    --line-strong: #3c4a57;
    --ink: #e6edf3;
    --ink-2: #a9b7c4;
    --ink-3: #7d8c9a;
    --accent: #e08b3e;
    --accent-soft: #3a2a17;
    --on-accent: #10161c;
    --ok: #4fbf8e;
    --ok-soft: #16302a;
    --bad: #e88070;
    --bad-soft: #33201c;
    --d1: #e08b3e;
    --d2: #5aa9b8;
    --d3: #8790d6;
    --d4: #c08ab0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -.015em; }

  button { font: inherit; color: inherit; cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */

  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .bar-id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .bar-id strong { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .bar-spacer { flex: 1; }

  .bar-stat { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .bar-stat b { font-family: var(--mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar-stat.low b { color: var(--bad); }

  .progress-track {
    width: 160px;
    height: 5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

  /* ---------- buttons ---------- */

  .btn {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }
  .btn-lg { padding: 13px 26px; font-size: 15px; }
  .btn-flag[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* ---------- shell ---------- */

  .shell { max-width: 1120px; margin: 0 auto; padding: 28px 22px 72px; }

  .runner {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 232px;
    gap: 28px;
    align-items: start;
  }

  /* ---------- start screen ---------- */

  .cover { max-width: 760px; margin: 0 auto; }
  .cover-head { padding: 8px 0 26px; }
  .cover h1 { font-size: 40px; line-height: 1.1; margin: 10px 0 12px; }
  .cover-sub { font-family: var(--serif); font-size: 18px; line-height: 1.6; color: var(--ink-2); max-width: 60ch; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .panel-pad { padding: 22px 24px; }
  .panel + .panel { margin-top: 20px; }
  .panel h2 { font-size: 15px; margin-bottom: 14px; }

  table.comp { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.comp th {
    text-align: left;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
    padding: 0 0 8px;
    border-bottom: 1px solid var(--line);
  }
  table.comp td { padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.comp tr:last-child td { border-bottom: 0; padding-bottom: 0; }
  table.comp .right { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 9px; vertical-align: baseline; }

  .weight-bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; margin: 18px 0 0; }
  .weight-bar span { display: block; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mode {
    display: block;
    text-align: left;
    padding: 15px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
  }
  .mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .mode b { display: block; font-size: 14px; margin-bottom: 3px; }
  .mode span { font-size: 13px; color: var(--ink-2); line-height: 1.45; }

  .start-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 22px; }
  .start-note { font-size: 13px; color: var(--ink-3); }

  ul.rules { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
  ul.rules li { margin-bottom: 7px; }
  ul.rules li:last-child { margin-bottom: 0; }

  /* ---------- question ---------- */

  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .qhead {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 26px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .qnum { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  .tag {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--line-strong);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .tag.dom { border-color: transparent; color: var(--on-accent); }
  .tag.multi { border-color: var(--accent); color: var(--accent); }

  .qbody { padding: 26px; }
  .stem { font-family: var(--serif); font-size: 19px; line-height: 1.55; margin: 0 0 22px; max-width: 66ch; }

  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    width: 100%;
    text-align: left;
    padding: 13px 15px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--surface);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.45;
    transition: border-color .12s ease, background .12s ease;
  }
  .opt:hover:not([disabled]) { border-color: var(--ink-3); background: var(--surface-2); }
  .opt .key {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.9;
    text-align: center;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    color: var(--ink-2);
  }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[aria-pressed="true"] .key { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .opt[disabled] { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .opt .mark { font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .opt.correct .mark { color: var(--ok); }
  .opt.wrong .mark { color: var(--bad); }

  .rationale { margin-top: 22px; border-left: 3px solid var(--line-strong); padding: 2px 0 2px 18px; }
  .rationale.hit { border-left-color: var(--ok); }
  .rationale.miss { border-left-color: var(--bad); }
  .rationale h3 { font-size: 13px; margin-bottom: 8px; }
  .rationale h3.hit { color: var(--ok); }
  .rationale h3.miss { color: var(--bad); }
  .rationale p { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; color: var(--ink-2); margin: 0 0 10px; max-width: 68ch; }
  .rationale p:last-child { margin-bottom: 0; }
  .rationale b { color: var(--ink); font-weight: 600; }
  .rationale p.signal {
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 11px 14px;
    font-size: 15px;
  }
  .rationale p.signal b { color: var(--accent); }

  .qfoot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 9px;
    flex-wrap: wrap;
  }
  .qfoot .grow { flex: 1; }

  /* ---------- navigator ---------- */

  .nav-panel { position: sticky; top: 74px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
  .nav-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  /* 5 columns x 13 rows fills all 65 questions exactly, with no orphan row */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .cell {
    position: relative;
    aspect-ratio: 1;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--surface);
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell:hover { border-color: var(--ink-3); }
  .cell.done { background: var(--surface-2); border-color: var(--ink-3); color: var(--ink); font-weight: 600; }
  .cell.flag::after {
    content: "";
    position: absolute;
    top: 2px;
    right: 2px;
    width: 5px;
    height: 5px;
    border-radius: 99px;
    background: var(--accent);
  }
  .cell.hit { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .cell.miss { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .cell.now { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }

  .legend { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .chip { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-strong); flex: none; }
  .chip.done { background: var(--surface-2); border-color: var(--ink-3); }
  .chip.flag { background: var(--accent); border-color: var(--accent); }

  .nav-actions { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .nav-actions .btn { width: 100%; }

  /* ---------- results ---------- */

  .score-head {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 34px;
    align-items: center;
    padding: 30px 32px;
  }
  .verdict { display: flex; flex-direction: column; gap: 4px; }
  .verdict .pct { font-family: var(--mono); font-size: 60px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .verdict .raw { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
  .verdict-label {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .verdict-label.pass { background: var(--ok-soft); color: var(--ok); }
  .verdict-label.fail { background: var(--bad-soft); color: var(--bad); }
  .score-note { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; color: var(--ink-2); max-width: 56ch; }

  .dom-rows { display: flex; flex-direction: column; }
  .dom-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 18px; align-items: center; padding: 15px 0; border-top: 1px solid var(--line); }
  .dom-row:first-child { border-top: 0; }
  .dom-label { display: flex; align-items: baseline; gap: 9px; font-size: 14px; font-weight: 500; margin-bottom: 8px; flex-wrap: wrap; }
  .dom-label .w { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .meter { position: relative; height: 9px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 99px; }
  .target { position: absolute; top: -4px; bottom: -4px; left: 70%; width: 1px; background: var(--ink-3); }
  .dom-score { text-align: right; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
  .dom-score b { font-weight: 600; }
  .dom-score span { color: var(--ink-3); }

  .weak { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .weak h3 { font-size: 13px; margin-bottom: 10px; }
  .weak h3 .w { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: 6px; }
  .topic.more { background: transparent; border-color: var(--line-strong); color: var(--ink-3); }
  .topic-list { display: flex; flex-wrap: wrap; gap: 7px; }
  .topic {
    font-size: 12.5px;
    padding: 5px 10px;
    border-radius: 5px;
    background: var(--bad-soft);
    color: var(--bad);
    border: 1px solid transparent;
  }

  .review-head { display: flex; align-items: center; gap: 12px; margin: 34px 0 16px; flex-wrap: wrap; }
  .review-head h2 { font-size: 17px; }
  .filters { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .filter { font-size: 12.5px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); }
  .filter[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .review-list { display: flex; flex-direction: column; gap: 14px; }
  .empty { padding: 26px; text-align: center; color: var(--ink-3); font-size: 14px; }

  @media (max-width: 900px) {
    .runner { grid-template-columns: minmax(0, 1fr); }
    .nav-panel { position: static; }
    .grid { grid-template-columns: repeat(13, 1fr); }  /* 13 x 5, also exact */
    .score-head { grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 24px; }
  }
  @media (max-width: 620px) {
    .shell { padding: 20px 14px 60px; }
    .bar { gap: 12px; padding: 9px 14px; }
    .progress-track { display: none; }
    .cover h1 { font-size: 30px; }
    .modes { grid-template-columns: 1fr; }
    .grid { gap: 3px; }
    .cell { font-size: 10px; }
    .qbody, .qhead { padding-left: 16px; padding-right: 16px; }
    .verdict .pct { font-size: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<header class="bar">
  <div class="bar-id">
    <span class="eyebrow" id="barEyebrow"></span>
    <strong id="barTitle"></strong>
  </div>
  <div class="bar-spacer"></div>
  <div class="bar-stat" id="answeredStat" hidden>
    <span class="eyebrow">Answered</span>
    <b><span id="answeredCount">0</span>/<span id="totalCount">65</span></b>
  </div>
  <div class="progress-track" id="progressTrack" hidden><div class="progress-fill" id="progressFill"></div></div>
  <div class="bar-stat" id="timerStat" hidden>
    <span class="eyebrow" id="timerLabel">Time remaining</span>
    <b id="timer">90:00</b>
  </div>
</header>

<main class="shell" id="shell"></main>

<script>
  const DATA = /*__EXAM_DATA__*/;

  const EXAM = DATA.exam;
  const QUESTIONS = DATA.questions;
  const DOMAINS = {};
  EXAM.domains.forEach(d => DOMAINS[d.id] = d);
  const DOM_COLOR = id => `var(--d${id})`;
  const STORE_KEY = `clf-${EXAM.slug}`;
  const PASS_MARK = 0.7;

  const state = {
    screen: "cover",       // cover | exam | results
    mode: "exam",          // exam | study
    answers: {},           // id -> array of letters
    flags: {},             // id -> true
    current: 0,
    endsAt: null,
    remaining: EXAM.time_limit_minutes * 60,
    reviewFilter: "missed"
  };

  /* ---------- persistence (per-viewer convenience only) ---------- */

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        screen: state.screen, mode: state.mode, answers: state.answers,
        flags: state.flags, current: state.current, remaining: state.remaining
      }));
    } catch (e) { /* private mode or blocked storage - the exam still works */ }
  }

  function restore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (!saved || saved.screen === "cover") return;
      Object.assign(state, {
        screen: saved.screen, mode: saved.mode || "exam",
        answers: saved.answers || {}, flags: saved.flags || {},
        current: saved.current || 0,
        remaining: typeof saved.remaining === "number" ? saved.remaining : state.remaining
      });
      if (state.screen === "exam") state.endsAt = Date.now() + state.remaining * 1000;
    } catch (e) { /* ignore unreadable saved state */ }
  }

  /* ---------- scoring ---------- */

  const selected = q => state.answers[q.id] || [];
  const isAnswered = q => selected(q).length > 0;
  const isComplete = q => q.type === "multi" ? selected(q).length === 2 : selected(q).length === 1;
  const isCorrect = q => {
    const picked = selected(q);
    return picked.length === q.answers.length && q.answers.every(a => picked.includes(a));
  };
  const answeredCount = () => QUESTIONS.filter(isAnswered).length;
  // A question is graded once the exam is submitted, or - in study mode - once this
  // particular question has a complete answer. Never before it has been answered.
  const graded = q => state.screen === "results" || (state.mode === "study" && isComplete(q));

  function results() {
    const perDomain = EXAM.domains.map(d => {
      const qs = QUESTIONS.filter(q => q.domain === d.id);
      const right = qs.filter(isCorrect).length;
      return { ...d, total: qs.length, right, pct: right / qs.length };
    });
    const right = QUESTIONS.filter(isCorrect).length;
    return { right, total: QUESTIONS.length, pct: right / QUESTIONS.length, perDomain };
  }

  /* ---------- timer ---------- */

  let ticker = null;

  function startTimer() {
    state.endsAt = Date.now() + state.remaining * 1000;
    stopTimer();
    ticker = setInterval(tick, 1000);
    tick();
  }
  function stopTimer() { if (ticker) { clearInterval(ticker); ticker = null; } }

  function tick() {
    state.remaining = Math.max(0, Math.round((state.endsAt - Date.now()) / 1000));
    paintTimer();
    if (state.remaining % 5 === 0) save();
    if (state.remaining === 0) { stopTimer(); submit(true); }
  }

  function clock(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function paintTimer() {
    const el = document.getElementById("timer");
    if (el) el.textContent = clock(state.remaining);
    const stat = document.getElementById("timerStat");
    if (stat) stat.classList.toggle("low", state.remaining <= 300);
  }

  function paintBar() {
    const exam = state.screen === "exam";
    document.getElementById("answeredStat").hidden = !exam;
    document.getElementById("progressTrack").hidden = !exam;
    document.getElementById("timerStat").hidden = state.screen === "cover";
    document.getElementById("totalCount").textContent = QUESTIONS.length;
    document.getElementById("answeredCount").textContent = answeredCount();
    document.getElementById("progressFill").style.width =
      (answeredCount() / QUESTIONS.length * 100) + "%";
    document.getElementById("barEyebrow").textContent = EXAM.eyebrow;
    document.getElementById("barTitle").textContent =
      state.screen === "results" ? `Results — ${EXAM.short_title}` : EXAM.short_title;
    if (state.screen === "results") {
      document.getElementById("timerLabel").textContent = "Time used";
      document.getElementById("timer").textContent =
        clock(EXAM.time_limit_minutes * 60 - state.remaining);
    } else {
      document.getElementById("timerLabel").textContent = "Time remaining";
      paintTimer();
    }
  }

  /* ---------- helpers ---------- */

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function domTag(id) {
    return `<span class="tag dom" style="background:${DOM_COLOR(id)}">${esc(DOMAINS[id].name)}</span>`;
  }

  /* ---------- cover ---------- */

  function renderCover() {
    const hasOfficial = EXAM.domains.some(d => d.official_weight);
    const officialTotal = EXAM.domains.reduce((n, d) => n + (d.official_weight || 0), 0);
    const rows = EXAM.domains.map(d => `
      <tr>
        <td><span class="swatch" style="background:${DOM_COLOR(d.id)}"></span>${d.id}. ${esc(d.name)}</td>
        <td class="right">${d.weight}%</td>
        ${hasOfficial ? `<td class="right">${d.official_weight}%</td>` : ""}
        <td class="right">${d.questions}</td>
      </tr>`).join("");

    const bars = EXAM.domains.map(d =>
      `<span style="flex:${d.weight};background:${DOM_COLOR(d.id)}" title="${esc(d.name)} ${d.weight}%"></span>`
    ).join("");

    const resumable = answeredCount() > 0;

    return `
      <section class="cover">
        <div class="cover-head">
          <span class="eyebrow">${esc(EXAM.short_title)} &middot; ${QUESTIONS.length} questions
            &middot; ${EXAM.time_limit_minutes} minutes</span>
          <h1>${esc(EXAM.heading)}</h1>
          <p class="cover-sub">${esc(EXAM.subtitle)}</p>
        </div>

        <div class="panel panel-pad">
          <h2>Exam composition</h2>
          <table class="comp">
            <thead><tr>
              <th>Domain</th>
              <th class="right">${hasOfficial ? "This exam" : "Official weighting"}</th>
              ${hasOfficial ? '<th class="right">Real exam</th>' : ""}
              <th class="right">Questions</th>
            </tr></thead>
            <tbody>${rows}
              <tr>
                <td><b>Total</b></td>
                <td class="right"><b>100%</b></td>
                ${hasOfficial ? `<td class="right"><b>${officialTotal}%</b></td>` : ""}
                <td class="right"><b>${QUESTIONS.length}</b></td>
              </tr>
            </tbody>
          </table>
          <div class="weight-bar">${bars}</div>
        </div>

        <div class="panel panel-pad">
          <h2>Choose how to take it</h2>
          <div class="modes">
            <button class="mode" data-mode="exam" aria-pressed="${state.mode === "exam"}">
              <b>Exam mode</b>
              <span>${EXAM.time_limit_minutes}-minute countdown, answers hidden until you submit. Closest to test day.</span>
            </button>
            <button class="mode" data-mode="study" aria-pressed="${state.mode === "study"}">
              <b>Study mode</b>
              <span>Grades each question as you answer and shows the explanation immediately.</span>
            </button>
          </div>
          <div class="start-row">
            <button class="btn btn-primary btn-lg" id="start">${resumable ? "Resume exam" : "Start exam"}</button>
            ${resumable ? '<button class="btn" id="reset">Start over</button>' : ""}
            <span class="start-note">${resumable
              ? `${answeredCount()} of ${QUESTIONS.length} answered &middot; ${clock(state.remaining)} left`
              : "Your progress is saved in this browser if you need to stop."}</span>
          </div>
        </div>

        <div class="panel panel-pad">
          <h2>Before you begin</h2>
          <ul class="rules">
            <li>There is no penalty for guessing, so answer every question.</li>
            <li>Questions marked <b>Choose TWO</b> need exactly two selections and are scored all or nothing.</li>
            <li>Flag anything you want to revisit; flagged questions show a dot in the navigator.</li>
            <li>The real exam scales to 100&ndash;1000 with a pass at 700, roughly 70% of the scored
              questions. This one reports plain percentages and marks 70% as the line.</li>
            ${(EXAM.rules || []).map(r => `<li>${esc(r)}</li>`).join("")}
          </ul>
        </div>
      </section>`;
  }

  /* ---------- question ---------- */

  function optionRow(q, letter, text, opts) {
    const picked = selected(q).includes(letter);
    const show = opts.graded;
    const right = q.answers.includes(letter);
    const cls = ["opt"];
    let mark = "";
    if (show && right) { cls.push("correct"); mark = picked ? "Correct — your answer" : "Correct answer"; }
    else if (show && picked) { cls.push("wrong"); mark = "Your answer"; }
    return `
      <button class="${cls.join(" ")}" data-letter="${letter}" aria-pressed="${picked}" ${show ? "disabled" : ""}>
        <span class="key">${letter}</span>
        <span>${esc(text)}${mark ? `<br><span class="mark">${mark}</span>` : ""}</span>
      </button>`;
  }

  function questionCard(q, opts) {
    const show = opts.graded;
    const hit = isCorrect(q);
    const options = Object.entries(q.options)
      .map(([letter, text]) => optionRow(q, letter, text, opts)).join("");

    const rationale = show ? `
      <div class="rationale ${hit ? "hit" : "miss"}">
        <h3 class="${hit ? "hit" : "miss"}">${hit ? "Correct" : (isAnswered(q) ? "Incorrect" : "Not answered")}
          &middot; ${esc(q.topic)}</h3>
        <p>${esc(q.explanation)}</p>
        ${q.signal ? `<p class="signal"><b>Signal:</b> ${esc(q.signal)}</p>` : ""}
        <p><b>Why the other options are wrong:</b> ${esc(q.distractors)}</p>
      </div>` : "";

    return `
      <article class="qcard" data-qid="${q.id}">
        <div class="qhead">
          <span class="qnum">Question ${String(q.id).padStart(2, "0")} / ${QUESTIONS.length}</span>
          ${domTag(q.domain)}
          ${q.type === "multi" ? '<span class="tag multi">Choose two</span>' : ""}
        </div>
        <div class="qbody">
          <p class="stem">${esc(q.stem)}</p>
          <div class="options">${options}</div>
          ${rationale}
        </div>
      </article>`;
  }

  function renderExam() {
    const q = QUESTIONS[state.current];
    const show = graded(q);
    const cells = QUESTIONS.map((item, i) => {
      const cls = ["cell"];
      if (i === state.current) cls.push("now");
      if (state.mode === "study" && isComplete(item)) cls.push(isCorrect(item) ? "hit" : "miss");
      else if (isAnswered(item)) cls.push("done");
      if (state.flags[item.id]) cls.push("flag");
      return `<button class="${cls.join(" ")}" data-goto="${i}" aria-label="Question ${item.id}">${item.id}</button>`;
    }).join("");

    const left = QUESTIONS.length - answeredCount();

    return `
      <div class="runner">
        <div>
          ${questionCard(q, { graded: show })}
          <div class="qfoot">
            <button class="btn" id="prev" ${state.current === 0 ? "disabled" : ""}>&larr; Previous</button>
            <button class="btn btn-flag" id="flag" aria-pressed="${!!state.flags[q.id]}">
              ${state.flags[q.id] ? "Flagged" : "Flag for review"}
            </button>
            ${show && state.mode === "study"
              ? '<button class="btn" id="clear">Clear answer</button>' : ""}
            <span class="grow"></span>
            ${state.current === QUESTIONS.length - 1
              ? '<button class="btn btn-primary" id="submit">Submit exam</button>'
              : '<button class="btn btn-primary" id="next">Next &rarr;</button>'}
          </div>
        </div>

        <aside class="nav-panel">
          <div class="nav-head">
            <span class="eyebrow">Navigator</span>
            <span class="num" style="font-size:12px;color:var(--ink-3)">${left} left</span>
          </div>
          <div class="grid">${cells}</div>
          <div class="legend">
            <div><span class="chip done"></span> Answered</div>
            <div><span class="chip flag"></span> Flagged for review</div>
          </div>
          <div class="nav-actions">
            <button class="btn btn-primary" id="submit2">Submit exam</button>
          </div>
        </aside>
      </div>`;
  }

  /* ---------- results ---------- */

  function renderResults() {
    const r = results();
    const pass = r.pct >= PASS_MARK;
    const pct = Math.round(r.pct * 100);

    const rows = r.perDomain.map(d => `
      <div class="dom-row">
        <div>
          <div class="dom-label">
            <span class="swatch" style="background:${DOM_COLOR(d.id)}"></span>
            ${d.id}. ${esc(d.name)}
            <span class="w">${d.weight}% of this exam${d.official_weight
              ? ` &middot; ${d.official_weight}% of the real exam` : ""}</span>
          </div>
          <div class="meter">
            <i style="width:${Math.round(d.pct * 100)}%;background:${DOM_COLOR(d.id)}"></i>
            <span class="target" title="70% pass line"></span>
          </div>
        </div>
        <div class="dom-score"><b>${Math.round(d.pct * 100)}%</b> <span>${d.right}/${d.total}</span></div>
      </div>`).join("");

    // Missed topics, weakest domain first, capped so the list stays scannable.
    const byDomainGap = new Map(r.perDomain.map(d => [d.id, d.pct]));
    const allTopics = [...new Set(QUESTIONS
      .filter(q => !isCorrect(q))
      .sort((a, b) => byDomainGap.get(a.domain) - byDomainGap.get(b.domain))
      .map(q => q.topic))];
    const TOPIC_CAP = 15;
    const uniqueTopics = allTopics.slice(0, TOPIC_CAP);
    const moreTopics = allTopics.length - uniqueTopics.length;

    const filters = [
      ["missed", `Missed (${r.total - r.right})`],
      ["flagged", `Flagged (${Object.keys(state.flags).length})`],
      ["all", `All (${r.total})`]
    ].map(([k, label]) =>
      `<button class="filter" data-filter="${k}" aria-pressed="${state.reviewFilter === k}">${label}</button>`
    ).join("");

    let list = QUESTIONS;
    if (state.reviewFilter === "missed") list = QUESTIONS.filter(q => !isCorrect(q));
    if (state.reviewFilter === "flagged") list = QUESTIONS.filter(q => state.flags[q.id]);

    const cards = list.length
      ? list.map(q => questionCard(q, { graded: true })).join("")
      : `<div class="panel empty">Nothing to review here. ${state.reviewFilter === "missed"
          ? "You answered every question correctly." : "You did not flag any questions."}</div>`;

    return `
      <section>
        <div class="panel">
          <div class="score-head">
            <div class="verdict">
              <span class="eyebrow">Score</span>
              <span class="pct">${pct}%</span>
              <span class="raw">${r.right} of ${r.total} correct</span>
              <span class="verdict-label ${pass ? "pass" : "fail"}">
                ${pass ? "Above the 70% pass line" : "Below the 70% pass line"}
              </span>
            </div>
            <p class="score-note">${pass
              ? `A pass at this composition suggests you are ready. Work through the missed questions
                 below, then take a second full-length exam under timed conditions to confirm.`
              : `You need about 70% to pass the real exam. The domain breakdown below shows where the
                 gap is &mdash; study the weakest domain first, since domain weighting decides how much
                 each gap costs you.`}
              Time used: ${clock(EXAM.time_limit_minutes * 60 - state.remaining)} of
              ${EXAM.time_limit_minutes} minutes.</p>
          </div>
        </div>

        <div class="panel panel-pad" style="margin-top:20px">
          <h2>Score by domain</h2>
          <div class="dom-rows">${rows}</div>
          ${uniqueTopics.length ? `
            <div class="weak">
              <h3>Topics to review <span class="w" style="font-weight:400">weakest domain first</span></h3>
              <div class="topic-list">${uniqueTopics.map(t => `<span class="topic">${esc(t)}</span>`).join("")}${
                moreTopics ? `<span class="topic more">+${moreTopics} more in the review below</span>` : ""}</div>
            </div>` : ""}
        </div>

        <div class="review-head">
          <h2>Question review</h2>
          <div class="filters">${filters}</div>
        </div>
        <div class="review-list">${cards}</div>

        <div class="start-row">
          <button class="btn btn-primary btn-lg" id="retake">Retake this exam</button>
          <span class="start-note">Retaking clears your answers and resets the 90-minute timer.</span>
        </div>
      </section>`;
  }

  /* ---------- actions ---------- */

  function pick(q, letter) {
    if (graded(q)) return;
    const picked = selected(q).slice();
    const at = picked.indexOf(letter);
    if (q.type === "multi") {
      if (at > -1) picked.splice(at, 1);
      else { if (picked.length >= 2) picked.shift(); picked.push(letter); }
    } else {
      picked.length = 0;
      if (at === -1) picked.push(letter);
    }
    if (picked.length) state.answers[q.id] = picked; else delete state.answers[q.id];
    save();
    render();
  }

  function go(i) {
    state.current = Math.max(0, Math.min(QUESTIONS.length - 1, i));
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function submit(auto) {
    const missing = QUESTIONS.filter(q => !isComplete(q)).length;
    if (!auto && missing > 0) {
      const ok = confirm(
        `${missing} question${missing === 1 ? " is" : "s are"} unanswered or incomplete. ` +
        `There is no penalty for guessing. Submit anyway?`);
      if (!ok) return;
    }
    stopTimer();
    state.screen = "results";
    state.reviewFilter = "missed";
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function reset() {
    stopTimer();
    Object.assign(state, {
      screen: "cover", answers: {}, flags: {}, current: 0,
      remaining: EXAM.time_limit_minutes * 60, endsAt: null
    });
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- render + events ---------- */

  function render() {
    const shell = document.getElementById("shell");
    shell.innerHTML = state.screen === "cover" ? renderCover()
      : state.screen === "exam" ? renderExam() : renderResults();
    paintBar();
  }

  document.addEventListener("click", e => {
    const hit = sel => e.target.closest(sel);
    const q = QUESTIONS[state.current];

    if (hit(".mode")) { state.mode = hit(".mode").dataset.mode; save(); render(); return; }
    if (hit("#start")) {
      state.screen = "exam";
      startTimer();
      save(); render(); return;
    }
    if (hit("#reset") || hit("#retake")) { reset(); return; }
    if (hit(".opt") && !hit(".opt").disabled) { pick(q, hit(".opt").dataset.letter); return; }
    if (hit("#prev")) { go(state.current - 1); return; }
    if (hit("#next")) { go(state.current + 1); return; }
    if (hit("#clear")) { delete state.answers[q.id]; save(); render(); return; }
    if (hit("#flag")) {
      if (state.flags[q.id]) delete state.flags[q.id]; else state.flags[q.id] = true;
      save(); render(); return;
    }
    if (hit("[data-goto]")) { go(Number(hit("[data-goto]").dataset.goto)); return; }
    if (hit("#submit") || hit("#submit2")) { submit(false); return; }
    if (hit(".filter")) { state.reviewFilter = hit(".filter").dataset.filter; render(); return; }
  });

  document.addEventListener("keydown", e => {
    if (state.screen !== "exam") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const q = QUESTIONS[state.current];
    const letters = Object.keys(q.options);
    const key = e.key.toUpperCase();
    if (letters.includes(key)) { e.preventDefault(); pick(q, key); return; }
    const byIndex = Number(e.key);
    if (byIndex >= 1 && byIndex <= letters.length) { e.preventDefault(); pick(q, letters[byIndex - 1]); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(state.current - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); go(state.current + 1); }
  });

  restore();
  if (state.screen === "exam") startTimer();
  render();
</script>
